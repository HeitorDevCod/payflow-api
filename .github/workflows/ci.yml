name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testes e cobertura
        run: mvn -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Build da imagem Docker
        run: docker build -t payflow-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Build de produção
        run: npm run build

      - name: Build do modo demonstração
        run: npx ng build --configuration demo

      - name: Testes de interface (modo demonstração)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4300 --directory dist/payflow-web/browser > /dev/null 2>&1 &
          sleep 2
          node e2e/smoke.mjs http://localhost:4300

      - name: Captura da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: frontend/smoke-failure.png
          if-no-files-found: ignore
