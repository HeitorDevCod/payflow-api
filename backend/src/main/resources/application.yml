spring:
  application:
    name: payflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}
    issuer: payflow-api

mercadopago:
  base-url: ${MP_BASE_URL:https://api.mercadopago.com}
  access-token: ${MP_ACCESS_TOKEN:}
  public-key: ${MP_PUBLIC_KEY:}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  notification-url: ${MP_NOTIFICATION_URL:}
  webhook-tolerance: PT5M
  connect-timeout: PT5S
  read-timeout: PT15S

payments:
  pix-expiration: PT30M
  boleto-expiration: P3D
  max-installments: 12
  min-installment-amount: 5.00
  reconciliation:
    enabled: true
    interval: PT10M
    stale-after: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    document: ${ADMIN_DOCUMENT:}
